<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>伴读书房</title>
<meta name="description" content="章节导读、有趣的表达、我的提问与笔记。">
<meta name="theme-color" content="#F1F4EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111714" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="伴读">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap">
<style>
/* Layout: single-column field notebook — book shelf → chapter index → chapter guide → original text reader */
:root{
  --paper:#F1F4EE; --surface:#FBFCF9; --ink:#1B2520; --muted:#5B6A61; --line:#D3DBD1;
  --accent:#2D6A51; --accent-ink:#FFFFFF; --mark:#EDE3AE; --deep:#8A4B2A;
  --f-display:"Noto Serif SC","Songti SC","STSong",serif;
  --f-body:-apple-system,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif;
  --f-en:"Literata",Georgia,"Times New Roman",serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#111714; --surface:#18201C; --ink:#E2E9E3; --muted:#93A399; --line:#2A3530;
  --accent:#7BBB9B; --accent-ink:#0E1512; --mark:#3A3622; --deep:#D99A74; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#111714; --surface:#18201C; --ink:#E2E9E3; --muted:#93A399; --line:#2A3530;
  --accent:#7BBB9B; --accent-ink:#0E1512; --mark:#3A3622; --deep:#D99A74; color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--paper);margin:0}
html{-webkit-text-size-adjust:100%;scroll-padding-top:calc(60px + env(safe-area-inset-top,0px))}
body{color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.7;
  padding:0 max(16px,env(safe-area-inset-right,0px)) calc(48px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  -webkit-tap-highlight-color:transparent}
.wrap{max-width:680px;margin:0 auto;padding-top:env(safe-area-inset-top,0px)}
a{color:var(--accent)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,a:focus-visible,label:focus-within{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}

.bar{position:sticky;top:0;z-index:5;background:var(--paper);display:flex;align-items:center;gap:8px;
  padding:calc(12px + env(safe-area-inset-top,0px)) 0 12px;margin-top:calc(-1 * env(safe-area-inset-top,0px));border-bottom:1px solid var(--line);margin-bottom:20px}
.bar .back{border:0;background:none;padding:6px 8px 6px 0;color:var(--accent);font-size:15px;white-space:nowrap}
.bar .crumb{flex:1;min-width:0;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .tools{display:flex;gap:6px}
.chipbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13px}

h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.35;margin:0}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
.en{font-family:var(--f-en)}

/* Shelf */
.shelf-head{padding-block:28px 8px}
.shelf-head h1{font-size:28px}
.shelf-head p{color:var(--muted);margin:6px 0 0}
.books{display:grid;gap:8px;margin-top:14px}
.book{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:center;text-align:left;width:100%;
  background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 12px}
.spine{height:60px;border-radius:2px 3px 3px 2px;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;overflow:hidden;
  font-family:var(--f-display);font-size:10px;line-height:1;writing-mode:vertical-rl;letter-spacing:.04em;white-space:nowrap;box-shadow:inset 4px 0 0 rgba(0,0,0,.15)}
.book .bk{min-width:0}
.book h2{font-size:16px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.book .meta{font-size:13px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta2{display:flex;gap:6px;align-items:center;font-size:12px;margin-top:4px;color:var(--muted)}
.meta2 .cnt{margin-left:auto;font-variant-numeric:tabular-nums}
.st{font-weight:600}.st-reading{color:var(--accent)}.st-done{color:var(--deep)}
.tg{border:1px solid var(--line);border-radius:999px;padding:0 7px}
.sec{font-size:13px;letter-spacing:.08em;color:var(--muted);font-weight:600;margin:18px 0 8px}
.cont{display:grid;gap:8px}
.contcard{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:center;text-align:left;width:100%;
  background:var(--surface);border:1px solid var(--accent);border-radius:6px;padding:10px 12px}
.contcard b{font-size:16px}.contcard .meta{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.filters{margin-top:22px;display:grid;gap:8px}
#shelfq{width:100%;font:inherit;font-size:15px;padding:8px 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13px;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chips .sep{width:1px;height:18px;background:var(--line);margin:0 4px}
.meter{height:4px;background:var(--line);border-radius:2px;margin-top:6px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent)}
.shelf-foot{margin-top:32px;padding-top:16px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.shelf-foot .actions{margin-top:10px}
.install{margin-top:20px;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:6px;padding:12px 14px;font-size:14px}
.install b{display:block;margin-bottom:2px}
.install .x{float:right;border:0;background:none;color:var(--muted);font-size:18px;line-height:1;padding:0 0 0 8px}

/* Book index */
.bookhead h1{font-size:24px}
.bookhead .en{color:var(--muted);font-style:italic}
.toc{list-style:none;margin:24px 0 0;padding:0;border-top:1px solid var(--line)}
.toc li{border-bottom:1px solid var(--line)}
.toc button{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:baseline;width:100%;text-align:left;background:none;border:0;padding:14px 0}
.toc .no{font-family:var(--f-en);color:var(--muted);font-variant-numeric:tabular-nums;font-size:14px}
.toc .t{min-width:0}
.toc .t b{display:block;font-weight:600}
.toc .t span{font-family:var(--f-en);font-style:italic;font-size:14px;color:var(--muted)}
.toc .t small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.toc .pending{opacity:.5;cursor:default}
.pill{font-size:12px;border-radius:999px;padding:1px 9px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.read{border-color:var(--accent);color:var(--accent)}
.pill.deep{border-color:var(--deep);color:var(--deep)}

/* Chapter guide */
.chhead .no{font-family:var(--f-en);font-size:14px;color:var(--muted)}
.chhead h1{font-size:26px;margin-top:4px}
.chhead .en{font-style:italic;color:var(--muted);font-size:17px}
.lede{font-size:17px;margin:16px 0 0;padding-left:14px;border-left:3px solid var(--accent)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:8px 14px;font-size:14px;display:inline-block}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);font-weight:600}
.btn.deepbtn[aria-pressed="true"]{border-color:var(--deep);color:var(--deep)}
section.block{margin-top:36px}
section.block>h2{font-size:19px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.point{padding-block:16px 4px}
.point h3{font-size:17px;display:flex;gap:10px;align-items:baseline}
.point h3 .n{font-family:var(--f-en);color:var(--accent);font-size:15px;font-variant-numeric:tabular-nums}
.md p{margin:8px 0}
.md ul{margin:8px 0;padding-left:1.2em}
.md li{margin:4px 0}
.md blockquote{margin:10px 0;padding:8px 12px;background:var(--mark);border-radius:4px;font-size:15px}
.md strong{font-weight:600}
.expr{display:grid;grid-template-columns:1fr auto;gap:8px;padding-block:14px;border-bottom:1px dashed var(--line)}
.expr:last-child{border-bottom:0}
.expr q{quotes:none;font-family:var(--f-en);font-size:16px;background:linear-gradient(transparent 55%,var(--mark) 55%);padding:0 2px}
.expr .zh{font-size:15px;color:var(--ink);margin-top:6px}
.star{border:0;background:none;font-size:20px;line-height:1;color:var(--muted);padding:4px;min-width:36px;min-height:36px}
.star[aria-pressed="true"]{color:var(--deep)}
.qs{padding-left:1.3em}
.qs li{margin:8px 0}
.qa{padding-block:16px;border-bottom:1px dashed var(--line)}
.qa:last-child{border-bottom:0}
.qa .ask{display:flex;gap:10px;align-items:baseline;font-weight:600}
.qa .ask::before{content:attr(data-q);flex:none;font-size:12px;font-weight:400;border-radius:4px;padding:0 6px;background:var(--accent);color:var(--accent-ink)}
.qa .ans{margin-top:6px}
.qa .when{font-size:12px;color:var(--muted);margin-top:4px}
textarea{width:100%;min-height:140px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);
  padding:12px;font:inherit;font-size:16px;line-height:1.6;resize:vertical}
.saved{font-size:12px;color:var(--muted);height:18px}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:40px}
.pager button{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:12px;text-align:left;font-size:14px;min-width:0}
.pager button:last-child{text-align:right}
.pager small{display:block;color:var(--muted);font-size:12px}
.pager button[disabled]{visibility:hidden}
.starred-list .from{font-size:12px;color:var(--muted);margin-top:4px}

/* Reader */
.loadbox{background:var(--surface);border:1px dashed var(--line);border-radius:6px;padding:20px;text-align:center}
.loadbox p{margin:6px 0;color:var(--muted);font-size:14px}
.loadbox label{display:inline-block;margin-top:10px;cursor:pointer}
.loadbox input{position:absolute;width:1px;height:1px;opacity:0}
.orig{font-family:var(--f-en);font-size:var(--rs,18px);line-height:1.75}
.orig h1,.orig h2,.orig h3{font-family:var(--f-en);font-weight:600;margin:1.2em 0 .6em}
.orig h1{font-size:1.5em}.orig h2{font-size:1.25em}.orig h3{font-size:1.1em}
.orig p{margin:0 0 1em}
.orig blockquote{margin:1em 0;padding-left:1em;border-left:3px solid var(--line);color:var(--muted)}
.orig ::selection{background:var(--mark)}
.excerpt{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:6;
  background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:10px 18px;font-size:14px;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(70px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);
  padding:8px 16px;border-radius:999px;font-size:13px;z-index:7;max-width:calc(100% - 32px)}
.toclist{list-style:none;padding:0;margin:12px 0 0;text-align:left}
.toclist button{width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:10px 0;font-family:var(--f-en)}

.empty{color:var(--muted);text-align:center;padding:60px 0}
/* English mode */
.hrow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.spine.sp-en{font-family:var(--f-en);font-size:9px;letter-spacing:0}
.zhsub{font-family:var(--f-display);color:var(--muted);font-size:15px}
.toc .t span.zhsub{font-family:var(--f-display);font-style:normal}
.untrans{font-size:13px;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:6px;padding:8px 12px;margin:14px 0 0}
.enn{color:var(--muted)}
html[lang="en"] body{line-height:1.65}
html[lang="en"] .md,html[lang="en"] .lede,html[lang="en"] .qs{font-family:var(--f-en)}
.note{color:var(--muted);font-size:13px}
@media (prefers-reduced-motion:no-preference){.view{animation:fade .2s ease-out}}
@keyframes fade{from{opacity:.4}to{opacity:1}}
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="shelf-head">
    <div class="eyebrow">伴读书房</div>
    <h1>正在打开书架…</h1>
  </div>
</div>
<div class="toast" id="toast" hidden></div>
<input type="file" id="restorefile" accept="application/json,.json" hidden>
<script src="vendor/jszip.min.js"></script>
<script src="app.js"></script>
</body>
</html>
